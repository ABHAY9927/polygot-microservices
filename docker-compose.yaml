services:
  api:
    build: ./api
    container_name: api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=dummy_value_for_assignment

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
